name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit and integration tests use mocked and recorded Qloo data; nothing calls the live API.
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, fixture data)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Saved plans come from tests/fixtures/samples (fictional), so no Qloo key is needed.
      - run: npm run test:e2e
        env:
          CI: "true"
