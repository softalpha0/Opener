# Render Blueprint: one Docker web service. The free plan works but sleeps when idle
# (first request after a nap takes ~1 min); the Starter plan stays awake.
services:
  - type: web
    name: opener
    runtime: docker
    plan: free # free instances sleep after ~15 min idle; "starter" (paid) stays awake
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: OPENER_WARM_ON_START
        value: "true"
    # Optional: keep the 24h Qloo cache across deploys (requires a paid disk).
    # disk:
    #   name: opener-cache
    #   mountPath: /app/.cache
    #   sizeGB: 1
